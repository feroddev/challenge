version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: telemetry_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - telemetry_network

  postgres_test:
    image: postgres:14
    container_name: telemetry_postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry_test
    networks:
      - telemetry_network

networks:
  telemetry_network:
    driver: bridge

volumes:
  postgres_data:
