version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry_api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: telemetry
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      NATS_URL: nats://nats:4222
      NATS_GYROSCOPE_TOPIC: gyroscope.telemetry
      NATS_GPS_TOPIC: gps.telemetry
      NATS_PHOTO_TOPIC: photo.telemetry
      NATS_RETRY_ATTEMPTS: 3
      NATS_RETRY_DELAY: 5
      NATS_DEAD_LETTER_TOPIC: telemetry.deadletter
      JWT_SECRET: chave_secreta_muito_segura_para_jwt_tokens_123456789
      JWT_TOKEN_DURATION: 24
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_PERIOD: 60
      ENCRYPTION_KEY: chave_de_32_bytes_para_criptogra
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - telemetry_network
    restart: unless-stopped

  postgres:
    image: postgres:14
    container_name: telemetry_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - telemetry_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:14
    container_name: telemetry_postgres_test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telemetry_test
    networks:
      - telemetry_network

  redis:
    image: redis:7
    container_name: telemetry_redis
    ports:
      - "6379:6379"
    networks:
      - telemetry_network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  nats:
    image: nats:2.9
    container_name: telemetry_nats
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - telemetry_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "nats-server --help"]
      interval: 5s
      timeout: 5s
      retries: 5

  gyroscope-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumers
    container_name: telemetry_gyroscope_consumer
    command: /app/gyroscope-consumer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: telemetry
      DB_SSLMODE: disable
      NATS_URL: nats://nats:4222
      NATS_GYROSCOPE_TOPIC: gyroscope.telemetry
      NATS_RETRY_ATTEMPTS: 3
      NATS_RETRY_DELAY: 5
      NATS_DEAD_LETTER_TOPIC: telemetry.deadletter
      JWT_SECRET: chave_secreta_muito_segura_para_jwt_tokens_123456789
      JWT_TOKEN_DURATION: 24
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_PERIOD: 60
      ENCRYPTION_KEY: chave_de_32_bytes_para_criptogra
    depends_on:
      - postgres
      - nats
    networks:
      - telemetry_network
    restart: unless-stopped

  gps-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumers
    container_name: telemetry_gps_consumer
    command: /app/gps-consumer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: telemetry
      DB_SSLMODE: disable
      NATS_URL: nats://nats:4222
      NATS_GPS_TOPIC: gps.telemetry
      NATS_RETRY_ATTEMPTS: 3
      NATS_RETRY_DELAY: 5
      NATS_DEAD_LETTER_TOPIC: telemetry.deadletter
      JWT_SECRET: chave_secreta_muito_segura_para_jwt_tokens_123456789
      JWT_TOKEN_DURATION: 24
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_PERIOD: 60
      ENCRYPTION_KEY: chave_de_32_bytes_para_criptogra
    depends_on:
      - postgres
      - nats
    networks:
      - telemetry_network
    restart: unless-stopped

  photo-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumers
    container_name: telemetry_photo_consumer
    command: /app/photo-consumer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: telemetry
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      NATS_URL: nats://nats:4222
      NATS_PHOTO_TOPIC: photo.telemetry
      NATS_RETRY_ATTEMPTS: 3
      NATS_RETRY_DELAY: 5
      NATS_DEAD_LETTER_TOPIC: telemetry.deadletter
      JWT_SECRET: chave_secreta_muito_segura_para_jwt_tokens_123456789
      JWT_TOKEN_DURATION: 24
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_PERIOD: 60
      ENCRYPTION_KEY: chave_de_32_bytes_para_criptogra
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - telemetry_network
    restart: unless-stopped

networks:
  telemetry_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
