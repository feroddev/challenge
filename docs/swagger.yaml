swagger: "2.0"
info:
  description: "API para receber e processar dados de telemetria de dispositivos Android"
  version: "1.0.0"
  title: "API de Telemetria"
  contact:
    email: "suporte@example.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
host: "localhost:8080"
basePath: "/api/v1"
tags:
- name: "telemetria"
  description: "Endpoints para dados de telemetria"
- name: "monitoramento"
  description: "Endpoints para monitoramento e métricas"
schemes:
- "http"
paths:
  /telemetry/gyroscope:
    post:
      tags:
      - "telemetria"
      summary: "Receber dados do giroscópio"
      description: "Recebe e salva dados do giroscópio de dispositivos"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Dados do giroscópio"
        required: true
        schema:
          $ref: "#/definitions/Gyroscope"
      responses:
        201:
          description: "Dados recebidos com sucesso"
          schema:
            type: "object"
            properties:
              message:
                type: "string"
        400:
          description: "Dados inválidos"
        500:
          description: "Erro interno"
    get:
      tags:
      - "telemetria"
      summary: "Obter dados do giroscópio"
      description: "Retorna todos os dados do giroscópio armazenados"
      produces:
      - "application/json"
      responses:
        200:
          description: "Operação bem-sucedida"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Gyroscope"
        500:
          description: "Erro interno"
  /telemetry/gps:
    post:
      tags:
      - "telemetria"
      summary: "Receber dados de GPS"
      description: "Recebe e salva dados de GPS de dispositivos"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Dados de GPS"
        required: true
        schema:
          $ref: "#/definitions/GPS"
      responses:
        201:
          description: "Dados recebidos com sucesso"
          schema:
            type: "object"
            properties:
              message:
                type: "string"
        400:
          description: "Dados inválidos"
        500:
          description: "Erro interno"
    get:
      tags:
      - "telemetria"
      summary: "Obter dados de GPS"
      description: "Retorna todos os dados de GPS armazenados"
      produces:
      - "application/json"
      responses:
        200:
          description: "Operação bem-sucedida"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/GPS"
        500:
          description: "Erro interno"
  /telemetry/photo:
    post:
      tags:
      - "telemetria"
      summary: "Receber dados de foto"
      description: "Recebe e salva dados de foto de dispositivos"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "body"
        description: "Dados da foto"
        required: true
        schema:
          $ref: "#/definitions/Photo"
      responses:
        201:
          description: "Dados recebidos com sucesso"
          schema:
            type: "object"
            properties:
              message:
                type: "string"
        400:
          description: "Dados inválidos"
        500:
          description: "Erro interno"
    get:
      tags:
      - "telemetria"
      summary: "Obter dados de foto"
      description: "Retorna todos os dados de foto armazenados"
      produces:
      - "application/json"
      responses:
        200:
          description: "Operação bem-sucedida"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Photo"
        500:
          description: "Erro interno"
  /metrics:
    get:
      tags:
      - "monitoramento"
      summary: "Métricas Prometheus"
      description: "Retorna métricas no formato Prometheus"
      produces:
      - "text/plain"
      responses:
        200:
          description: "Operação bem-sucedida"
  /health:
    get:
      tags:
      - "monitoramento"
      summary: "Health check"
      description: "Verifica se a API está funcionando corretamente"
      produces:
      - "application/json"
      responses:
        200:
          description: "API funcionando corretamente"
          schema:
            type: "object"
            properties:
              status:
                type: "string"
definitions:
  Gyroscope:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      x:
        type: "number"
        format: "float"
      y:
        type: "number"
        format: "float"
      z:
        type: "number"
        format: "float"
      timestamp:
        type: "string"
        format: "date-time"
      deviceID:
        type: "string"
  GPS:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      latitude:
        type: "number"
        format: "float"
      longitude:
        type: "number"
        format: "float"
      timestamp:
        type: "string"
        format: "date-time"
      deviceID:
        type: "string"
  Photo:
    type: "object"
    properties:
      id:
        type: "integer"
        format: "int64"
      photo:
        type: "string"
      timestamp:
        type: "string"
        format: "date-time"
      deviceID:
        type: "string"
      recognized:
        type: "boolean"
      similarity:
        type: "number"
        format: "float"
